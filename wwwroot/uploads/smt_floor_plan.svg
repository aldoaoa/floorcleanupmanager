<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <pattern id="esd-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#0b1329" stroke="#1e2942" stroke-width="1"/>
      <circle cx="20" cy="20" r="1.5" fill="#00f2fe" opacity="0.3"/>
    </pattern>
    <linearGradient id="smt-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background conductive tile grid -->
  <rect width="1200" height="675" fill="url(#esd-grid)" />
  
  <!-- Outer Walls / Factory Bounds -->
  <rect x="20" y="20" width="1160" height="635" fill="none" stroke="#3b82f6" stroke-width="4" opacity="0.6"/>

  <!-- Zone Headers -->
  <text x="50" y="60" fill="#00f2fe" font-family="Segoe UI, sans-serif" font-size="22" font-weight="bold" letter-spacing="2">LÍNEA SMT 01 - PISO CONDUCTIVO (ANSI/ESD S20.20-2021)</text>

  <!-- SMT Machine Line 1 -->
  <rect x="150" y="180" width="900" height="140" rx="10" fill="url(#smt-line)" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Screen Printer Station -->
  <rect x="180" y="200" width="140" height="100" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="250" y="255" fill="#e0f2fe" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">IMPRESORA DE PASTA</text>
  
  <!-- Pick & Place High Speed -->
  <rect x="360" y="200" width="220" height="100" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="470" y="255" fill="#e0f2fe" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">PICK &amp; PLACE CHIPPER</text>
  
  <!-- Reflow Oven Station (Hot Zone) -->
  <rect x="620" y="200" width="240" height="100" rx="6" fill="#2a1215" stroke="#ef4444" stroke-width="2"/>
  <text x="740" y="245" fill="#fca5a5" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">HORNO REFLUJO</text>
  <text x="740" y="270" fill="#f87171" font-family="sans-serif" font-size="11" text-anchor="middle">ZONA CRÍTICA ALTA TEMPERATURA</text>

  <!-- AOI Optical Inspection -->
  <rect x="890" y="200" width="130" height="100" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="955" y="255" fill="#e0f2fe" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">INSPECCIÓN AOI</text>

  <!-- ESD Grounding Benches & Walkways -->
  <path d="M 100 420 L 1100 420" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 5"/>
  <text x="600" y="410" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PASILLO PEATONAL CONDUCTIVO - USO OBLIGATORIO TALONERAS ESD</text>

  <!-- ESD Measurement Nodes Rendered on Map -->
  <g id="measurement-node-p1">
    <circle cx="306" cy="202.5" r="14" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="2"/>
    <circle cx="306" cy="202.5" r="5" fill="#10b981"/>
    <text x="306" y="175" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">P-01 (4.5E+07 Ω)</text>
  </g>

  <g id="measurement-node-p2">
    <circle cx="696" cy="303.75" r="18" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="2" filter="url(#glow)"/>
    <circle cx="696" cy="303.75" r="6" fill="#ef4444"/>
    <text x="696" y="340" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">P-02 (2.4E+08 Ω) ¡ALTA!</text>
  </g>

  <g id="measurement-node-p3">
    <circle cx="960" cy="472.5" r="14" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="2"/>
    <circle cx="960" cy="472.5" r="5" fill="#10b981"/>
    <text x="960" y="505" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">P-03 (3.8E+07 Ω)</text>
  </g>
</svg>
