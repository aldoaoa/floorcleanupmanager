<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <pattern id="assy-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="20" r="1.5" fill="#38bdf8" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#assy-grid)" />
  <rect x="20" y="20" width="1160" height="635" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.5"/>

  <text x="50" y="60" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="22" font-weight="bold" letter-spacing="2">ÁREA DE ENSAMBLE Y PRUEBAS - MAPA ESD</text>

  <!-- Workstations Row 1 -->
  <g transform="translate(150, 150)">
    <rect x="0" y="0" width="220" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="110" y="65" fill="#e0f2fe" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">MESA SOLDADURA 01</text>
  </g>

  <g transform="translate(450, 150)">
    <rect x="0" y="0" width="220" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="110" y="65" fill="#e0f2fe" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">MESA SOLDADURA 02</text>
  </g>

  <!-- Functional Test Benches -->
  <g transform="translate(750, 150)">
    <rect x="0" y="0" width="300" height="180" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="150" y="90" fill="#fef3c7" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">PRUEBA FUNCIONAL (ICT / FCT)</text>
  </g>

  <!-- Nodes -->
  <g transform="translate(360, 270)">
    <circle cx="0" cy="0" r="14" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#10b981"/>
    <text x="0" y="30" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">P-01 (5.2E+07 Ω)</text>
  </g>

  <g transform="translate(840, 405)">
    <circle cx="0" cy="0" r="18" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#ef4444"/>
    <text x="0" y="35" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">P-02 (1.8E+08 Ω) ¡REVISIÓN!</text>
  </g>
</svg>
